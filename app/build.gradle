plugins {
    id 'com.android.application'
}

android {
    namespace 'com.byd.autodarkwallpaper'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId "com.byd.autodarkwallpaper"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly files('../bydauto-openapi.jar')
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sunr1se.byd.autowallpaper'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId "com.sunr1se.byd.autowallpaper"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.annotation:annotation:1.9.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.ow2.asm:asm:9.9.1'
    testImplementation 'org.ow2.asm:asm-commons:9.9.1'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.ow2.asm:asm-util:9.9.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.9.1'
}
